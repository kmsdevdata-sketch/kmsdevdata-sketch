<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="Minseo Kim · Backend Developer"><title>Minseo Kim · Backend Developer</title><style>text{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif;} .mono{font-family:'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}
      .flow{stroke-dasharray:6 6;animation:flow 1.6s linear infinite}
      .ok{transform-origin:778px 105px;animation:pop 3.2s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-24}}
      @keyframes pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}}
      @media (prefers-reduced-motion: reduce){.flow,.ok{animation:none}}</style><rect width="860" height="210" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="40" y="62" class="mono" font-size="13" font-weight="600" letter-spacing="2" fill="#818b98">BACKEND DEVELOPER</text><text x="38" y="112" font-size="44" font-weight="800" fill="#1f2328">Minseo Kim</text><text x="40" y="150" font-size="17" font-weight="700" fill="#1f2328">“됐다”고 말하기 전에,</text><text x="40" y="176" font-size="17" font-weight="700" fill="#1f2328">무엇으로 확인했는지부터 묻는 백엔드 개발자입니다.</text><rect x="508" y="85" width="80" height="40" rx="9" fill="#f6f8fa" stroke="#d0d7de"/><text x="548" y="110" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#59636e">Plan</text><rect x="610" y="85" width="80" height="40" rx="9" fill="#f6f8fa" stroke="#d0d7de"/><text x="650" y="110" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#59636e">Apply</text><path class="flow" d="M588 105 H610" stroke="#818b98" stroke-width="2" fill="none"/><path class="flow" d="M690 105 H740" stroke="#1f883d" stroke-width="2" fill="none"/><g class="ok"><circle cx="778" cy="105" r="30" fill="none" stroke="#1f883d" stroke-width="2.5"/><path d="M765 106 l9 9 l18 -20" stroke="#1f883d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="778" y="158" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#1f883d">verified</text></svg>